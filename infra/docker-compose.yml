name: btg-posts

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # La imagen oficial solo publica amd64; en Apple Silicon corre emulada.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      MSSQL_PID: Developer
    ports:
      - '${DB_PORT:-1433}:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Crea la base de datos si no existe; TypeORM solo gestiona el esquema dentro de ella.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-btg_posts}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$DB_PASSWORD" -b -Q \
          "IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME];"
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:-btg_posts}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      # 127.0.0.1 y no localhost: nginx escucha solo en IPv4 y localhost resuelve a ::1.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mssql-data:
